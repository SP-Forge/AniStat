services:
  anistat:
    build:
      context: ./anistat
      dockerfile: Dockerfile
    container_name: anistat-app
    ports:
      - "9070:3000"
      - "9071:3333"
    environment:
      - NODE_ENV=production
      - CLIENT_ID=${CLIENT_ID}
    # Sæt CLIENT_ID i Dokploy's miljøvariabler i stedet for .env
    restart: unless-stopped

networks:
  default:
    driver: bridge
